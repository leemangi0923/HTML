<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1과제 로봇 연동장치 조립 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --bg: #e4e8ea; --panel: #f7f8f8; --panel2: #edf0f1; --ink: #1a1e21; --muted: #59626a; --line: #cdd4d8;
  --accent: #f3c11b; --accent-ink: #261f00; --red: #cc2b38; --green: #1d7f47; --glove: #2d6cdf;
  --mat: #2c6a4d; --gl1: #3a7c5e; --gl2: #63a284; --dimc: #dcf0e5;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0e1113; --panel: #171b1e; --panel2: #1f2428; --ink: #e5e9eb; --muted: #97a1a8; --line: #2c3338;
    --mat: #1a3f2f; --gl1: #26543e; --gl2: #3a7357; --dimc: #b8d8c7; --glove: #5b8ff0; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #0e1113; --panel: #171b1e; --panel2: #1f2428; --ink: #e5e9eb; --muted: #97a1a8; --line: #2c3338;
  --mat: #1a3f2f; --gl1: #26543e; --gl2: #3a7357; --dimc: #b8d8c7; --glove: #5b8ff0; }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 12px 16px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 15px; white-space: nowrap; letter-spacing: -.01em; cursor: pointer; }
.brand b { background: var(--ink); color: var(--panel); padding: 1px 7px; border-radius: 4px; margin-right: 7px; font-size: 13px; }
.stages { display: flex; gap: 4px; flex-wrap: wrap; }
.stg { border: 1px solid var(--line); background: transparent; padding: 4px 11px 4px 5px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.stg .sn { width: 21px; height: 21px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--panel2); font-size: 12px; font-weight: 700; }
.stg.on { border-color: var(--ink); font-weight: 700; }
.stg.on .sn { background: var(--accent); color: var(--accent-ink); }
.stg.ok .sn { background: var(--green); color: #fff; }
.meta { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip { padding: 4px 9px; border-radius: 6px; background: var(--panel2); font-variant-numeric: tabular-nums; font-size: 13px; }
.chip-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 13px; }
.chip-btn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.tools { display: flex; gap: 3px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tool { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px; padding: 6px 6px 5px; border: 1.5px solid transparent; background: transparent; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--panel2); color: var(--ink); }
.tool.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tool.toggle.on { background: var(--glove); color: #fff; }
.tool.hint { border-color: var(--accent); color: var(--ink); }
/* 재료함, 할 일 접기: 칸 너비를 애니메이션하면 안쪽 내용이 벽 속으로 밀려 들어간다 */
@property --tw { syntax: '<length>'; inherits: true; initial-value: 236px; }
@property --sw { syntax: '<length>'; inherits: true; initial-value: 292px; }
.main { --tw: 236px; --sw: 292px; position: relative; display: grid; grid-template-columns: var(--tw) minmax(0, 1fr) var(--sw); min-height: 0; transition: --tw .34s cubic-bezier(.4, 0, .2, 1), --sw .34s cubic-bezier(.4, 0, .2, 1); }
.main.tray-off { --tw: 0px; }
.main.side-off { --sw: 0px; }
.main { overflow: hidden; }   /* 접은 칸의 테두리 1px이 화면 밖으로 나가 가로 스크롤바가 생기지 않게 */
.main.tray-off .tray, .main.side-off .side { border-width: 0; }
.tray, .side { position: relative; background: var(--panel); overflow: hidden; min-height: 0; }
.pane-in { position: absolute; top: 0; bottom: 0; overflow: auto; padding: 10px; box-sizing: border-box; transition: opacity .34s; }
.tray .pane-in { right: 0; width: 236px; }
.side .pane-in { left: 0; width: 292px; }
.main.tray-off .tray .pane-in, .main.side-off .side .pane-in { opacity: 0; visibility: hidden; transition: opacity .34s, visibility 0s .34s; }
.pane-tog { position: absolute; top: 10px; z-index: 8; display: grid; place-items: center; width: 22px; height: 46px; padding: 0; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; box-shadow: 0 3px 10px rgba(0, 0, 0, .18); }
.pane-tog:hover { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pane-tog svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .34s; }
#togTray { left: var(--tw); border-left: 0; border-radius: 0 9px 9px 0; }
#togSide { right: var(--sw); border-right: 0; border-radius: 9px 0 0 9px; }
.main.tray-off #togTray svg, .main.side-off #togSide svg { transform: rotate(180deg); }
.tray { border-right: 1px solid var(--line); }
.tie-handle { animation: tiePulse 1s ease-in-out infinite; }
@keyframes tiePulse { 50% { opacity: .5; } }
.tray.dropzone { outline: 2px dashed var(--accent); outline-offset: -5px; cursor: pointer; }
.tray.dropzone .ph { color: var(--ink); }
.side { border-left: 1px solid var(--line); }
h2.ph { font-size: 13px; margin: 2px 2px 8px; color: var(--muted); font-weight: 600; }
.tray-list { display: grid; gap: 8px; }
.tgroup { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.tgroup > summary { list-style: none; cursor: pointer; padding: 9px 10px; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.tgroup > summary::-webkit-details-marker { display: none; }
.tgroup > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
.tgroup[open] > summary::before { transform: rotate(90deg); }
.tgroup .gleft { margin-left: auto; font-weight: 500; color: var(--muted); font-size: 12px; }
.tray-items { display: grid; gap: 6px; padding: 0 8px 8px; }
.stg .sc { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.steps .gcount { font-weight: 500; margin-left: 4px; }
.titem { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); cursor: grab; user-select: none; -webkit-user-select: none; }
.titem .thumb { grid-row: 1 / 3; width: 56px; height: 42px; display: grid; place-items: center; }
.thumb svg { width: 100%; height: 100%; }
.titem .tname { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titem .tspec { grid-column: 2; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titem .ttape { grid-column: 2; font-size: 11px; color: var(--glove); }
.titem .tcount { grid-row: 1 / 3; grid-column: 3; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; }
.titem.wide { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; }   /* 길쭉한 부품(컨베이어)은 그림을 위에 넓게 */
.titem.wide .thumb { grid-row: 1; grid-column: 1 / -1; width: 100%; height: 58px; margin-bottom: 4px; }
.titem.wide .tname { grid-row: 2; grid-column: 1; }
.titem.wide .tspec, .titem.wide .ttape { grid-row: 3; grid-column: 1; }
.titem.wide .tcount { grid-row: 2 / 4; grid-column: 2; }
.titem.held { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.titem.empty { opacity: .42; cursor: default; }
.titem:not(.empty):hover { border-color: #e3232f; box-shadow: inset 0 0 0 1.5px #e3232f; background: color-mix(in srgb, var(--panel2) 88%, #000); }
.stage-area { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
.board-wrap { position: relative; min-height: 0; background: var(--mat); overflow: hidden; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 36px; height: 34px; cursor: pointer; font-weight: 600; }
.status { padding: 6px 12px; font-size: 12.5px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); min-height: 31px; }
.toast { position: absolute; left: 50%; top: 12px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, .28); font-size: 13.5px; max-width: min(92%, 560px); text-align: center; border-left: 4px solid var(--muted); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.board-wrap .toast { z-index: 6; top: var(--toast-top, 12px); }   /* 연습: 위 안내 칸 아래에 */
/* 회로도: 판 위에 꺼내 두고 보는 창 (끌어서 옮기고, 오른쪽 아래 모서리로 크기 조절) */
.circ { position: absolute; left: 12px; top: 12px; z-index: 4; width: min(640px, calc(100% - 24px)); min-width: 260px; min-height: 140px; max-width: calc(100% - 8px); max-height: calc(100% - 8px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px rgba(0, 0, 0, .35); resize: both; overflow: hidden; }
.circ[hidden] { display: none; }
.circ.big { left: 8px !important; top: 8px !important; width: calc(100% - 16px) !important; height: calc(100% - 16px) !important; resize: none; }
.circ-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); cursor: move; user-select: none; -webkit-user-select: none; touch-action: none; }
.circ-head b { font-size: 13.5px; margin-right: 2px; }
.circ-head button { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; height: 28px; padding: 0 9px; font-size: 12px; font-weight: 700; cursor: pointer; }
.circ-head button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.circ-head .sp { flex: 1; }
.circ-body { flex: 1; min-height: 0; overflow: auto; background: #fff; }
.circ-body img { display: block; width: 100%; height: auto; }
.circ-body img[hidden] { display: none; }
/* 시연 보기: 자막(위), 재생 막대(아래). 재생 중에는 판과 재료함을 만지지 않는다 */
.demo-block { position: absolute; inset: 0; z-index: 3; }
.demo-block[hidden], .demo-cap[hidden], .demo-bar[hidden] { display: none; }
.demo-cap { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 7; width: min(780px, calc(100% - 24px)); background: rgba(14, 18, 21, .88); color: #fff; border-radius: 10px; padding: 8px 14px 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); pointer-events: none; }
.dc-h { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; color: #c4ced5; }
.dc-h b { color: var(--accent); font-size: 14.5px; }
.dc-h .dc-all { margin-left: auto; font-variant-numeric: tabular-nums; }
.dc-g { margin-top: 3px; font-size: 13px; font-weight: 700; color: #9fd3ff; }
.dc-t { margin-top: 3px; font-size: 17px; font-weight: 800; line-height: 1.35; }
.dc-s { margin-top: 3px; font-size: 12.5px; line-height: 1.45; color: #d6dfe5; }
.demo-bar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 7; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: min(900px, calc(100% - 20px)); padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
.demo-bar button, .demo-bar select { height: 32px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--ink); font-weight: 700; cursor: pointer; }
.demo-bar button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.demo-bar .dst { display: flex; gap: 3px; }
.demo-bar .dst button { padding: 0 8px; min-width: 30px; }
.demo-bar input[type=range] { flex: 1 1 140px; min-width: 110px; accent-color: var(--accent); }
body.demo .zoom { display: none; }
.demo-dia { position: absolute; right: 10px; z-index: 7; width: min(46%, 560px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); overflow: hidden; pointer-events: none; }
.demo-dia[hidden] { display: none; }
.demo-dia .dd-h { display: flex; gap: 8px; align-items: baseline; padding: 5px 10px; font-size: 12.5px; font-weight: 800; border-bottom: 1px solid var(--line); }
.demo-dia .dd-h span { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); }
.demo-dia .dd-h i { font-style: normal; } .demo-dia .dd-h .r { color: #e3232f; } .demo-dia .dd-h .g { color: #16a34a; }
.demo-dia svg { display: block; width: 100%; height: auto; background: #fff; }
.demo-dia .dd-h button { pointer-events: auto; flex: none; height: 24px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--ink); font-size: 11.5px; font-weight: 700; cursor: pointer; }
/* 회로 해설: 회로가 어떻게 움직이는지 장면별로 */
.xp { position: fixed; inset: 0; z-index: 38; background: rgba(8, 12, 14, .6); display: grid; place-items: center; padding: 14px; font-family: var(--font); }
.xp[hidden] { display: none; }
.xp button { font: inherit; cursor: pointer; }
.xp-card { width: min(1320px, 100%); height: min(860px, 100%); display: flex; flex-direction: column; background: var(--panel); color: var(--ink); border-radius: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); overflow: hidden; }
.xp-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.xp-head > b { font-size: 16px; margin-right: 4px; }
.xp-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.xp-tabs button { height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel2); color: var(--ink); font-size: 12.5px; font-weight: 700; }
.xp-tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.xp-head .sp { flex: 1; }
.xp-key { font-size: 11.5px; color: var(--muted); }
.xp-x { height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel2); color: var(--ink); font-weight: 700; }
.xp-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.xp-body.role { grid-template-columns: minmax(0, 1fr); }
.xp-art { min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.xp-leg { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--muted); }
.xp-leg i { font-style: normal; font-weight: 700; } .xp-leg .r { color: #e3232f; } .xp-leg .g { color: #16a34a; } .xp-leg .o { color: #d97706; }
.xp-svg { flex: 1 1 auto; min-height: 0; width: 100%; height: 100%; display: block; }
.xp-flow { fill: none; stroke: #f59e0b; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16 12; animation: xpFlow .9s linear infinite; }
@keyframes xpFlow { to { stroke-dashoffset: -28; } }
.xp-side { min-height: 0; overflow: auto; padding: 14px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.xp-no { font-size: 12px; color: var(--muted); font-weight: 700; }
.xp-side h3 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.xp-d { margin: 0; font-size: 14.5px; line-height: 1.65; }
.xp-ws > b { font-size: 12px; color: var(--muted); }
.xp-ws ol, .xp-chain { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; counter-reset: xw; }
.xp-ws li, .xp-chain li { counter-increment: xw; display: grid; grid-template-columns: 20px minmax(0, 1fr) 14px minmax(0, 1fr); gap: 6px; align-items: center; padding: 5px 8px; border-radius: 7px; background: var(--panel2); font-size: 12.5px; border-left: 3px solid transparent; }
.xp-ws li::before, .xp-chain li::before { content: counter(xw); font-size: 11.5px; font-weight: 800; color: var(--muted); }
.xp-ws li.ok, .xp-chain li.ok { border-left-color: var(--green); }
.xp-ws li i, .xp-chain li i { font-style: normal; color: var(--muted); text-align: center; }
.xp-chain { width: 100%; max-width: 760px; margin: 0 auto; }
.xp-chain li { font-size: 14px; padding: 9px 12px; background: var(--panel); }
.xp-nav { display: flex; gap: 8px; }
.xp-nav button { flex: 1; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font-weight: 800; }
.xp-nav button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.xp-nav button:disabled { opacity: .45; cursor: default; }
.xp-list { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
.xp-list button { display: flex; gap: 8px; align-items: center; text-align: left; padding: 6px 8px; border: 0; border-radius: 7px; background: none; color: var(--ink); font-size: 13px; }
.xp-list button span { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--panel2); color: var(--muted); }
.xp-list button.past span { background: color-mix(in srgb, var(--green) 25%, var(--panel2)); color: var(--green); }
.xp-list button.on { background: var(--panel2); font-weight: 800; }
.xp-list button.on span { background: #ff3b30; color: #fff; }
.xp-role { min-height: 0; overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-content: start; }
.xp-role section { background: var(--panel2); border-radius: 10px; padding: 12px 14px; }
.xp-role h4 { margin: 0 0 8px; font-size: 14.5px; }
.xp-role dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; font-size: 13px; line-height: 1.5; }
.xp-role dt { font-weight: 800; } .xp-role dd { margin: 0; }
.pr-xp { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); } .pr-xp i { font-style: normal; font-weight: 800; color: var(--ink); }
@media (max-width: 820px) {
  .xp { padding: 0; } .xp-card { border-radius: 0; height: 100%; }
  .xp-key { display: none; }
  .xp-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(200px, 44%) minmax(0, 1fr); }
  .xp-body.role { grid-template-rows: minmax(0, 1fr); }
  .xp-side { border-left: 0; border-top: 1px solid var(--line); }
}
.dd-done { fill: none; stroke: #16a34a; stroke-opacity: .6; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.dd-now { fill: none; stroke: #ff3b30; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: demoDraw .7s ease-out forwards, demoPulse 1s ease-in-out .7s infinite; }
body.demo .tray, body.demo #tools, body.demo #stages, body.demo .chip-btn:not(#btnDemo) { pointer-events: none; opacity: .55; }
body.demo .side { pointer-events: none; }   /* 시연 중 할 일은 체크박스로, 흐리게 하지 않는다 */

.modal-card h2 { font-size: 19px; margin: 0 0 8px; letter-spacing: -.01em; }
.modal-card p, .modal-card li { font-size: 14px; }
.modal-card ul { padding-left: 18px; margin: 8px 0; }
.modal-card li { margin: 4px 0; }
.wl { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 3px; max-height: 52vh; overflow: auto; }
.modal-card .wl li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: start; margin: 0; padding: 6px 8px; border-radius: 7px; background: var(--panel2); font-size: 13px; border-left: 3px solid transparent; }
.modal-card .wl li.bad { border-left-color: var(--red); }
.wl-n { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.wl-t small { display: block; color: var(--red); font-size: 11.5px; margin-top: 1px; }
.wl-m { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wl-area { width: 100%; min-height: 180px; box-sizing: border-box; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); resize: vertical; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.actions button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 600; }
.actions .primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
table.sum { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 6px; }
table.sum th, table.sum td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.sum td:nth-child(n+2) { font-variant-numeric: tabular-nums; }
.warn { color: var(--red); }
.muted { color: var(--muted); }
svg text { font-family: var(--font); }
.matbg { fill: var(--mat); }
.gl1 { stroke: var(--gl1); }
.gl2 { stroke: var(--gl2); }
.dim path { stroke: var(--dimc); stroke-width: .6; fill: none; }
.dim text, .cable-label { fill: var(--dimc); }
.redmark { stroke: #e3232f; stroke-width: 1.3; fill: none; stroke-linecap: round; }
.redmark.thin { stroke-width: .9; stroke-dasharray: 7 3; }
.guide-slot { fill: rgba(243, 193, 27, .14); stroke: #f3c11b; stroke-width: 1; stroke-dasharray: 5 4; }
.guide-zone { fill: rgba(243, 193, 27, .2); stroke: #f3c11b; stroke-width: .5; stroke-dasharray: 2 1.5; }
.guide-pt { stroke: #f3c11b; stroke-width: .9; fill: none; }
.hov-ring { fill: none; stroke: #fff; stroke-width: .8; }
.pend-ring { fill: none; stroke: #f3c11b; stroke-width: 1.3; }
.guide-ring { fill: none; stroke: #f3c11b; stroke-width: .9; stroke-dasharray: 2 1.2; animation: pulse 1.2s ease-in-out infinite; }
.guide-line { stroke: #f3c11b; stroke-width: .7; stroke-dasharray: 3 3; fill: none; opacity: .85; }
.rubber { stroke: #f5c518; stroke-width: 1.4; stroke-dasharray: 3 2; }
.bad-wire { stroke: #e3232f; stroke-width: 2.2; stroke-linecap: round; }
.wire-o { fill: none; stroke: #4a3b00; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
.wire-i { fill: none; stroke: #f5c518; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@keyframes pulse { 50% { opacity: .3; } }
.board-wrap.shake { animation: shake .32s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .guide-ring, .board-wrap.shake { animation: none; } .toast { transition: none; } }
body.dragging, body.dragging *, body.panning, body.panning * { cursor: grabbing !important; }
*, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
::selection { background: transparent; }
button:focus:not(:focus-visible), summary:focus:not(:focus-visible), [tabindex]:focus:not(:focus-visible) { outline: none; }
.tgroup > summary { -webkit-tap-highlight-color: transparent; }
.follower { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 60; }   /* 포인터 오른쪽 아래 옆에 (포인터는 가리지 않는다) */
.follower[hidden] { display: none; }
.follower svg { display: block; overflow: visible; }
.fitem { position: relative; width: 76px; height: 56px; opacity: .95; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .35)); }
.fitem > svg { width: 100%; height: 100%; }
.fcount { position: absolute; right: -10px; top: -10px; min-width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 800 13px var(--font); border: 1.5px solid var(--accent-ink); padding: 0 4px; }
:focus-visible { outline: 2px solid var(--glove); outline-offset: 2px; }
.steps li.grp { display: block; padding: 10px 6px 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.steps li.errline { display: block; color: #fff; background: var(--red); font-weight: 600; }
.steps .why { grid-column: 1 / -1; font-size: 12px; color: var(--red); line-height: 1.5; }
.live { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.live-tip { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.55; }
.live-tip b { color: var(--ink); }
.wbelt.fwd { animation: wbeltF .13s linear infinite; }
.wbelt.rev { animation: wbeltR .13s linear infinite; }
.wbelt.both { stroke: var(--red); }
@keyframes wbeltF { to { stroke-dashoffset: -13; } }
@keyframes wbeltR { to { stroke-dashoffset: 13; } }
.exam-badge { padding: 4px 11px; border-radius: 999px; background: var(--red); color: #fff; font-size: 13px; font-weight: 700; }
#clock.late { background: var(--red); color: #fff; font-weight: 700; }
.chip-btn:disabled { opacity: .45; cursor: default; }
.steps li.ck { grid-template-columns: 18px auto minmax(0, 1fr) auto; align-items: center; }   /* 시연 보기: 할 일 체크박스 */
.steps .bx { display: grid; place-items: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid var(--muted); border-radius: 4px; color: #fff; font-size: 11px; font-weight: 900; line-height: 1; }
.steps li.ck.done .bx { background: var(--green); border-color: var(--green); }
.steps li.ck.done .bx::after { content: '✓'; }
.steps li.ck.pop .bx { animation: ckPop .45s ease-out; }
.steps li.ck.now .bx { border-color: #ff3b30; animation: ckBlink 1s ease-in-out infinite; }
.steps li.grp.on { color: var(--ink); }
.steps li.examcard { display: block; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); font-size: 13px; line-height: 1.55; }
.sc-total { display: flex; align-items: baseline; gap: 4px; margin: 6px 0 10px; }
.sc-total b { font-size: 34px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.sc-total span { color: var(--muted); font-weight: 600; }
.score { display: grid; gap: 4px; }
.sc-grp { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 10px 2px 2px; font-variant-numeric: tabular-nums; }
.sc-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 9px; border-radius: 8px; background: var(--panel2); border-left: 4px solid var(--line); font-size: 13px; }
.sc-row.ok { border-left-color: var(--green); }
.sc-row.part { border-left-color: var(--accent); }
.sc-row.zero { border-left-color: var(--red); }
.sc-no { font-weight: 700; font-variant-numeric: tabular-nums; }
.sc-t small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; line-height: 1.45; }
.sc-pt { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sc-pt small { font-weight: 500; color: var(--muted); }
.sc-self { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 12px; font-weight: 600; cursor: pointer; }
.sc-self input { width: 16px; height: 16px; margin: 0; }
.opmini { width: 100%; height: auto; display: block; margin: 4px 0 6px; background: var(--mat); border-radius: 8px; }
@media (max-width: 960px) {
  .app { height: auto; min-height: 100%; grid-template-rows: auto auto auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .main, .tray, .side { overflow: visible; }
  .pane-in, .tray .pane-in, .side .pane-in { position: static; width: auto; overflow: visible; opacity: 1 !important; visibility: visible !important; }
  .pane-tog { display: none; }
  .stage-area { order: 1; height: 64svh; min-height: 340px; }
  .tray { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  .side { order: 3; border-left: 0; border-top: 1px solid var(--line); }
  .tray-items { display: flex; overflow-x: auto; padding-bottom: 6px; }
  .titem { flex: none; width: 196px; }
  .meta { margin-left: 0; width: 100%; }
  .brand { font-size: 14px; }
}

showHome();   // 시작은 늘 메인 화면
window.SIM = { get S() { return S; }, get TERM() { return TERM; }, get UI() { return UI; }, tap: (x, y) => handleTap({ x, y }, null), tray: k => trayTap(k), tool: id => setTool(id),
  label: (zid, txt) => applyLabel(OP_ZONES.find(z => z.id === zid), txt), next: nextStage, jump: n => jumpTo(n), flip: () => toggleFlip(), wire: (a, b) => addWire(a, b), fit, zoomTo: b => fitTo(b), stageDone, getChecks, runChecks: w => runChecks(w, fuseState()), mixesACDC, liveDown, get LIVE() { return LIVE; } };

function toolArt(id) { return (TOOL_ART[id] || '') + (S.gloves && id !== 'glove' && TOOL_ART[id] ? `<g transform="translate(2 -46) scale(.55)">${GLOVE_ART}</g>` : ''); }   // 장갑을 끼면 포인터 위에 작은 장갑
TOOL_ART.meter = '<g transform="rotate(-45)"><path d="M0 0 L9 -.9 L9 .9 Z" fill="#c9cdd1" stroke="#6f777d" stroke-width=".4"/><rect x="9" y="-3.2" width="5" height="6.4" rx="1" fill="#3a3f44"/><rect x="14" y="-3.8" width="24" height="7.6" rx="3" fill="#d7262f" stroke="#7a1015"/></g><path d="M27 -27 C 33 -33, 30 -38, 37 -42" fill="none" stroke="#1d1f21" stroke-width="2"/><g transform="translate(34 -70)"><rect width="24" height="31" rx="3.5" fill="#f3c11b" stroke="#6b5200"/><rect x="3.5" y="3.5" width="17" height="9" rx="1.2" fill="#c8d6b9" stroke="#55603f" stroke-width=".6"/><circle cx="12" cy="21.5" r="5.2" fill="#2b2f33"/><path d="M12 21.5l3-3" stroke="#f3c11b" stroke-width="1.4"/></g>';   // 테스터: 빨간 리드봉 끝이 포인터
const TOOL_OFF = { stopper: 'translate(15 -24)', glove: 'translate(20 -8)', tape: 'translate(-17 17)' };   // 스톱퍼, 장갑은 포인터 오른쪽 위로 비켜 두고, 양면테이프는 롤 가운데가 포인터
const AIM_TOOLS = new Set(['stopper', 'glove']);   // 끝이 없는 그림만 누르는 곳에 원을 그린다
const toolPlaced = id => `<g transform="${TOOL_OFF[id] || ''}">${toolArt(id)}</g>`;   // 나머지는 끝(펜 끝, 니퍼 날, 전선 끝, 비트)이 포인터에 닿고 몸통은 오른쪽 위
function toolCursor(p) {   // 누르는 곳은 십자 포인터, 도구 그림은 포인터 오른쪽 위
  const k = (UI.cam.w / Math.max(1, svg.clientWidth)).toFixed(5), aim = AIM_TOOLS.has(S.tool) ? '<circle r="7" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".9"/><circle r="7" fill="none" stroke="#111" stroke-width="1.2"/><circle r="1.3" fill="#111" stroke="#fff" stroke-width=".8"/>' : '';
  return `<g transform="translate(${F(p.x)} ${F(p.y)}) scale(${k})" pointer-events="none">${aim}<g transform="scale(.8)">${toolPlaced(S.tool)}</g></g>`;
}
function updateFollower() {
  const el = $('#follower'), m = UI.mouse;
  if (!m || m.over || TZ.id || !$('#home').hidden || !(UI.carry || S.tool !== 'hand')) { el.hidden = true; return; }   // 메인 화면 위에서는 안 따라다닌다
  const key = UI.carry ? 'c' + UI.carry.kind + UI.carry.key + 'x' + (UI.carry.count || 1) : 't' + S.tool + (S.gloves ? 'g' : '');
  if (el.dataset.key !== key) { el.dataset.key = key; el.innerHTML = UI.carry ? `<div class="fitem">${trayThumb({ kind: UI.carry.kind, key: UI.carry.key })}${(UI.carry.count || 1) > 1 ? `<span class="fcount">×${UI.carry.count}</span>` : ''}</div>` : `<svg viewBox="-20 -60 90 90" width="72" height="72" aria-hidden="true">${toolPlaced(S.tool)}</svg>`; }
  el.hidden = false; el.style.left = (m.x + (UI.carry ? 14 : -16)) + 'px'; el.style.top = (m.y + (UI.carry ? -70 : -48)) + 'px';   // 포인터 오른쪽 위 (도구는 끝이 포인터에)
}
