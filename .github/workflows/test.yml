name: Simulator regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check runner Chrome
        run: /usr/bin/google-chrome --version
      - name: Simulator tests
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        shell: bash
        run: npm test 2>&1 | tee simulator-tests.log
      - name: Publish test result
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync('simulator-tests.log')) process.exit(0);
          const lines = fs.readFileSync('simulator-tests.log', 'utf8').split('\n');
          const selected = lines.filter(line => /^(?:not ok|✖|ℹ (?:tests|pass|fail|duration)|# (?:tests|pass|fail|duration))|^\s+(?:error:|location:|at TestContext)/.test(line)).map(line => line.slice(0, 350));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Simulator test result\n\n```text\n' + selected.slice(-80).join('\n') + '\n```\n');
          NODE
