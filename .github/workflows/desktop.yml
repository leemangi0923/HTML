name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - index.html
      - desktop/**
      - package.json
      - package-lock.json
      - tests/electron.smoke.cjs
      - .github/workflows/desktop.yml
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.sha }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and package version must match" }
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run dist:win
      - name: Test packaged Windows app
        shell: pwsh
        run: |
          $env:TASK1_EXECUTABLE = (Resolve-Path dist/win-unpacked/Task1Simulator.exe).Path
          npm run test:desktop
      - name: Record installer checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/*-setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: task1-windows-installer
          path: |
            dist/*-setup-*.exe
            dist/*-setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: task1-windows-installer
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          name: 1과제 제작 시뮬레이터 ${{ github.ref_name }}
          files: |
            release/*-setup-*.exe
            release/*-setup-*.exe.sha256
          fail_on_unmatched_files: true
          body: |
            Windows 10/11 64비트용 설치 파일입니다. 아래의 setup .exe를 내려받아 실행하세요.

            - 설치 경로 선택, 시작 메뉴·바탕화면 바로가기
            - 인터넷 없이 실행, F11 전체 화면
            - 자유·시험·고장 실습 기록을 앱에 자동 저장
            - 새 버전 설치 후에도 앱 저장 기록 유지
            - 브라우저 저장 기록과 별도로 사용

            이번 설치 파일에는 게시자 코드 서명이 없습니다. Windows에서 게시자 확인 안내가 표시될 수 있습니다.
